<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">



    <meta name="viewport"

          content="width=device-width, initial-scale=1.0">



    <title>Health AI Chatbot</title>



    <link rel="stylesheet" href="style.css">

</head>



<body>



<div class="container">



    <h1>🩺 Health AI Assistant</h1>



    <p class="subtitle">

        Type or speak your symptom

    </p>



    <!-- Language for Voice Recognition -->



    <div class="language-area">



        <label for="language">

            🌍 Voice Language

        </label>



        <select id="language">



            <option value="english">

                English

            </option>



            <option value="hindi">

                हिंदी - Hindi

            </option>



            <option value="telugu">

                తెలుగు - Telugu

            </option>



            <option value="french">

                Français - French

            </option>



        </select>



        <small>

            💡 For typed messages, the chatbot automatically detects your language.

        </small>



    </div>





    <!-- Chat -->



    <div id="chatBox" class="chat-box">



        <div class="bot message">



            <strong>🤖 Bot:</strong>



            <p>

                Hello! Tell me a symptom such as

                fever, headache or cough.

            </p>



        </div>



    </div>





    <!-- Input -->



    <div class="input-area">



        <input

            type="text"

            id="messageInput"

            placeholder="Type your symptom..."

            onkeydown="handleEnter(event)"

        >



        <button

            id="voiceButton"

            onclick="startVoiceRecognition()"

            title="Speak">

            🎤

        </button>



        <button

            onclick="sendMessage()"

            title="Send">

            ➤

        </button>



    </div>





    <p id="voiceStatus" class="voice-status"></p>





    <p class="disclaimer">



        ⚠️ This chatbot provides general health information

        and is not a substitute for professional medical advice.



    </p>



</div>





<script src="script.js"></script>



</body>

</html>
